/** Zonas de entrega por lugar (pickup + Z1–Z3). BA: mismos montos placeholder hasta mapa/montos propios. */
const PLACE_ZONE_CONFIG = {
  santafe: {
    mapImage: 'imgs/zonas_sf.jpg',
    options: [
      { id: 'pickup', label: 'Lo busco!', baseShip: 0, freeMin: null, popup: null },
      { id: 'z1', label: 'Zona 1', baseShip: 1000, freeMin: 30000, popup: 'Envío gratis a partir de $30000' },
      { id: 'z2', label: 'Zona 2', baseShip: 1000, freeMin: 40000, popup: 'Envío gratis a partir de $40000' },
      { id: 'z3', label: 'Zona 3', baseShip: 1000, freeMin: 50000, popup: 'Envío gratis a partir de $50000' }
    ]
  },
  buenosaires: {
    mapImage: null,
    options: [
      { id: 'pickup', label: 'Lo busco!', baseShip: 0, freeMin: null, popup: null },
      { id: 'z1', label: 'Zona 1', baseShip: 1000, freeMin: 30000, popup: 'Envío gratis a partir de $30000' },
      { id: 'z2', label: 'Zona 2', baseShip: 1000, freeMin: 40000, popup: 'Envío gratis a partir de $40000' },
      { id: 'z3', label: 'Zona 3', baseShip: 1000, freeMin: 50000, popup: 'Envío gratis a partir de $50000' }
    ]
  }
};

const ZONE_LS_PREFIX = 'deliveryZone__';

function getPlaceZoneConfig(placeId){
  return placeId ? PLACE_ZONE_CONFIG[placeId] : null;
}

function hasZoneDelivery(placeId){
  return !!(placeId && PLACE_ZONE_CONFIG[placeId]);
}

function loadDeliveryZoneForPlace(placeId){
  if(!hasZoneDelivery(placeId)){
    state.deliveryZone = '';
    return;
  }
  const ids = PLACE_ZONE_CONFIG[placeId].options.map(o => o.id);
  try{
    const v = localStorage.getItem(ZONE_LS_PREFIX + placeId);
    state.deliveryZone = (v && ids.includes(v)) ? v : '';
  } catch(e){
    state.deliveryZone = '';
  }
}

function saveDeliveryZoneForPlace(placeId){
  if(!hasZoneDelivery(placeId) || !state.deliveryZone) return;
  try{ localStorage.setItem(ZONE_LS_PREFIX + placeId, state.deliveryZone); } catch(e){}
}

function getCurrentZoneOption(){
  const cfg = getPlaceZoneConfig(state.place);
  if(!cfg || !state.deliveryZone) return null;
  return cfg.options.find(o => o.id === state.deliveryZone) || null;
}

/** Precio numérico de envío según subtotal y zona. */
function getShippingPrice(subtotal){
  const opt = getCurrentZoneOption();
  if(!opt) return 0;
  if(opt.baseShip === 0 || opt.id === 'pickup') return 0;
  if(opt.freeMin != null && subtotal >= opt.freeMin) return 0;
  return opt.baseShip;
}

/** Texto de línea de envío para totales y pedidos. */
function getShippingLine(subtotal){
  const opt = getCurrentZoneOption();
  if(!opt){
    if(hasZoneDelivery(state.place)) return 'Entrega — elegí una opción';
    return `Envío — ${fmt.format(0)}`;
  }
  const price = getShippingPrice(subtotal);
  if(price === 0 && opt.id !== 'pickup' && opt.freeMin != null && subtotal >= opt.freeMin){
    return `${opt.label} — ${fmt.format(0)} (gratis)`;
  }
  return `${opt.label} — ${fmt.format(price)}`;
}

// Función para limpiar cache (útil para debug)
function clearCache() {
  const keys = Object.keys(localStorage);
  const removed = keys.filter(key => key.startsWith('categories_') || key.startsWith('products_') || key.startsWith('catalog_'));
  removed.forEach(key => localStorage.removeItem(key));
  console.log('🧹 Cache limpiado:', removed);
  return removed.length;
}

// Cache con expiración de 24 horas
const CACHE_EXPIRY_MS = 24 * 60 * 60 * 1000; // 24 horas en milisegundos

function setCacheWithExpiry(key, data) {
  const cacheItem = {
    data: data,
    timestamp: Date.now()
  };
  localStorage.setItem(key, JSON.stringify(cacheItem));
}

function getCacheWithExpiry(key) {
  try {
    const cached = localStorage.getItem(key);
    if (!cached) return null;
    
    const cacheItem = JSON.parse(cached);
    
    // Si el formato es viejo (sin timestamp), tratarlo como expirado
    if (!cacheItem.timestamp) {
      return null;
    }
    
    // Verificar si ha expirado (más de 24 horas)
    const now = Date.now();
    const age = now - cacheItem.timestamp;
    
    if (age > CACHE_EXPIRY_MS) {
      // Cache expirado, eliminarlo
      localStorage.removeItem(key);
      return null;
    }
    
    return cacheItem.data;
  } catch (e) {
    // Si hay error al parsear, tratar como expirado
    console.warn('Cache corrupta, la ignoro', e);
    return null;
  }
}

// Precargar una imagen y retornar Promise
function preloadImage(url) {
  return new Promise((resolve, reject) => {
    if (!url) {
      resolve(); // Si no hay URL, resolver inmediatamente
      return;
    }
    const img = new Image();
    img.onload = () => resolve();
    img.onerror = () => resolve(); // Resolver incluso si falla para no bloquear
    img.src = url;
  });
}

// Precargar todas las imágenes de categorías
async function preloadCategoryImages() {
  const imageUrls = [];
  
  INDEX.forEach(cat => {
    const block = DATA[cat] || {cover:'', count: 0};
    let cover = normalizeImageUrl(block.cover || '');
    if (cover) {
      imageUrls.push(cover);
    }
  });
  
  // Esperar a que todas las imágenes se precarguen
  await Promise.all(imageUrls.map(url => preloadImage(url)));
}

function normalizeImageUrl(u, size=800){
  if(!u) return "";
  if(u.includes("drive.google.com/thumbnail")) return u;
  const m = u.match(/[?&]id=([A-Za-z0-9_-]+)/) || u.match(/\/d\/([A-Za-z0-9_-]+)/);
  const id = m ? m[1] : null;
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${size}` : u;
}

function sanitizeCatalog(data){
  const out = {};
  Object.keys(data || {}).forEach(cat=>{
    const block = data[cat] || {};
    const items = Array.isArray(block.items) ? [...block.items] : [];

    // sentinel para cover
    const idx = items.findIndex(p =>
      String(p?.name||'').trim().toLowerCase() === 'categoryimage' ||
      String(p?.id||'').trim().toLowerCase() === '_cover'
    );

    if (idx >= 0) {
      const raw = items[idx].imageUrl || '';
      block.cover = normalizeImageUrl(raw);
      items.splice(idx, 1);
    }
    if (block.cover) block.cover = normalizeImageUrl(block.cover);

    block.items = items;
    out[cat] = block;
  });
  return out;
}

/************ FETCH ************/
async function fetchPlacesMeta(){
  // Mostrar skeleton mientras carga lugares
  showPlacesSkeleton();
  
  let safeList = [
    { id: 'santafe', name: 'Santa Fe' },
    { id: 'buenosaires', name: 'Buenos Aires' }
  ];
  try{
    const res = await fetch(`${PRODUCTS_URL}?meta=places&bust=${Date.now()}`, { cache:'no-store' });
    const data = await res.json();
    const looksOk = Array.isArray(data) && data.length &&
      data.every(x => x && typeof x.id === 'string' && typeof x.name === 'string');
    if (looksOk) safeList = data;
  } catch(e){
    console.warn('Usando fallback de lugares:', e);
  }
  PLACES_META = safeList;
  renderPlaces();
}

async function fetchCategoriesForPlace(placeId){
  // Mostrar skeleton mientras carga
  if (state.view === 'home') showCategoriesSkeleton();
  
  const cacheKey = `categories_v2__${placeId}`;
  // 1) cache local con expiración de 24 horas
  const cached = getCacheWithExpiry(cacheKey);
  if (cached) {
    DATA = cached;
    INDEX = Object.keys(DATA);
    if (state.view === 'home') await renderHomeCats();
    return;
  }

  // 2) pedir fresco - solo categorías
  const res = await fetch(`${PRODUCTS_URL}?action=categories&place=${encode(placeId)}&bust=${Date.now()}`, { cache:'no-store' });
  const fresh = await res.json();
  
  // Debug: mostrar qué datos llegaron
  console.log('📊 Datos de categorías recibidos:', fresh);
  console.log('📝 Nombres de categorías:', Object.keys(fresh));
  
  DATA = fresh;
  INDEX = Object.keys(DATA);
  setCacheWithExpiry(cacheKey, DATA);
  if (state.view === 'home') await renderHomeCats();
}

async function fetchProductsForCategory(placeId, category){
  // Mostrar skeleton mientras carga productos
  showProductsSkeleton();
  
  const cacheKey = `products_v2__${placeId}__${category}`;
  // 1) cache local con expiración de 24 horas
  const cached = getCacheWithExpiry(cacheKey);
  if (cached) {
    DATA[category] = { ...DATA[category], items: cached };
    renderGrid();
    return;
  }

  // 2) pedir fresco - productos de una categoría
  const res = await fetch(`${PRODUCTS_URL}?action=products&place=${encode(placeId)}&category=${encode(category)}&bust=${Date.now()}`, { cache:'no-store' });
  const products = await res.json();
  setCacheWithExpiry(cacheKey, products);
  
  // Actualizar DATA con los productos cargados
  if (!DATA[category]) DATA[category] = {};
  DATA[category].items = products;
  renderGrid();
}

async function performGlobalSearch(query) {
  const catsGrid = $('#catsGrid');
  
  // Mostrar skeleton mientras busca
  showCategoriesSkeleton();
  
  try {
    const url = `${PRODUCTS_URL}?action=search&place=${state.place}&q=${encode(query)}&bust=${Date.now()}`;
    const resp = await fetch(url, { cache:'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    
    const products = await resp.json();
    
    // Renderizar resultados como tarjetas de productos
    renderSearchResults(products);
  } catch (err) {
    console.error('Error en búsqueda global:', err);
    catsGrid.innerHTML = `<p class="muted">Error al buscar productos</p>`;
  }
}

function buildProductCard(p) {
  const card = document.createElement('div');
  card.className = 'card';

  const thumb = document.createElement('div');
  const img = normalizeImageUrl(p.imageUrl);
  thumb.className = 'thumb' + (img ? ' hasimg' : '');
  if(img) thumb.style.backgroundImage = `url('${img}')`;
  else thumb.textContent = '🛍️';

  const content = document.createElement('div');
  content.className = 'content';
  content.innerHTML = `
    <h3 class="title">${p.name}</h3>
    <div class="desc">${p.description||''}</div>
    <div class="muted" style="margin:6px 0 8px">${p.category||''}</div>
    <div class="row-s" style="margin-bottom:8px; gap:8px">
      <select aria-label="Presentación" data-sel>
        ${(p.variants||[]).map((v,i)=>`<option value="${i}">${v.label} — ${fmt.format(+v.price||0)}</option>`).join('')}
      </select>
    </div>
    <div class="actions">
      <button class="btn" data-minus>-</button>
      <input type="number" min="1" value="1" style="width:70px; text-align:center" data-qty />
      <button class="btn" data-plus>+</button>
      <button class="btn primary" data-add>Agregar</button>
    </div>`;

  const qty = content.querySelector('[data-qty]');
  content.querySelector('[data-minus]').onclick = ()=> qty.value = Math.max(1, Number(qty.value)-1);
  content.querySelector('[data-plus]').onclick = ()=> qty.value = Number(qty.value)+1;
  content.querySelector('[data-add]').onclick = ()=>{
    const variantIndex = Number(content.querySelector('[data-sel]').value || 0);
    addToCart(p, variantIndex, Number(qty.value||1));
  };

  card.appendChild(thumb);
  card.appendChild(content);
  return card;
}

function renderSearchResults(products) {
  const catsGrid = $('#catsGrid');
  
  if (!products || products.length === 0) {
    catsGrid.innerHTML = `<p class="muted">No se encontraron productos</p>`;
    return;
  }
  
  // Cambiar a grid de productos (usar clase .grid en lugar de .catsgrid)
  catsGrid.className = 'grid';
  catsGrid.innerHTML = '';
  
  products.forEach(p => {
    const card = buildProductCard(p);
    catsGrid.appendChild(card);
  });
}

    const qty = content.querySelector('[data-qty]');
    content.querySelector('[data-minus]').onclick = ()=> qty.value = Math.max(1, Number(qty.value)-1);
    content.querySelector('[data-plus]').onclick = ()=> qty.value = Number(qty.value)+1;
    content.querySelector('[data-add]').onclick = ()=>{

const IMPORTANT_NOTICE_LS = 'nim_cart_important_intro_v1';
const IMPORTANT_ACCEPT_LS = 'nim_cart_important_accept_v1';
const IMPORTANT_ACCEPT_AT_LS = 'nim_cart_important_accept_at_v1';
const IMPORTANT_ACCEPT_TTL_MS = 60 * 60 * 1000;
const TRANSFER_ALIAS = 'somosnimu';
const TRANSFER_CVU = '0000003100098012892054';

let importantExpanded = false;
let importantIntroTimer = null;
let importantIntroScheduleLocked = false;

function getImportantIntroDone(){
  try { return localStorage.getItem(IMPORTANT_NOTICE_LS) === '1'; } catch(e) { return false; }
}
function setImportantIntroDone(){
  try { localStorage.setItem(IMPORTANT_NOTICE_LS, '1'); } catch(e) {}
}

function clearImportantAcceptStorage(){
  try {
    localStorage.removeItem(IMPORTANT_ACCEPT_LS);
    localStorage.removeItem(IMPORTANT_ACCEPT_AT_LS);
  } catch(e) {}
}

function getImportantAccepted(){
  try {
    if(localStorage.getItem(IMPORTANT_ACCEPT_LS) !== '1') return false;
    let at = parseInt(localStorage.getItem(IMPORTANT_ACCEPT_AT_LS), 10);
    if(!at || isNaN(at)){
      at = Date.now();
      localStorage.setItem(IMPORTANT_ACCEPT_AT_LS, String(at));
    }
    if(Date.now() - at > IMPORTANT_ACCEPT_TTL_MS){
      clearImportantAcceptStorage();
      return false;
    }
    return true;
  } catch(e) { return false; }
}

function setImportantAccepted(yes){
  try {
    if(yes){
      localStorage.setItem(IMPORTANT_ACCEPT_LS, '1');
      localStorage.setItem(IMPORTANT_ACCEPT_AT_LS, String(Date.now()));
    } else {
      clearImportantAcceptStorage();
    }
  } catch(e) {}
}

function clearImportantAcceptIfCartEmpty(){
  if(state.cart.length === 0) setImportantAccepted(false);
}

function clearImportantIntroTimer(){
  if(importantIntroTimer){
    clearTimeout(importantIntroTimer);
    importantIntroTimer = null;
  }
}

function onDrawerCloseImportant(){
  clearImportantIntroTimer();
  if(state.cart.length > 0 && !getImportantIntroDone()){
    setImportantIntroDone();
    importantExpanded = false;
  }
}

function scheduleImportantIntroIfNeeded(){
  if(state.cart.length === 0) return;
  if(getImportantIntroDone()) return;
  if(importantIntroScheduleLocked) return;
  importantIntroScheduleLocked = true;
  importantIntroTimer = setTimeout(() => {
    importantIntroTimer = null;
    importantExpanded = false;
    setImportantIntroDone();
    renderCart();
  }, 10000);
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(() => copyToClipboardFallback(text));
  }
  return Promise.resolve(copyToClipboardFallback(text));
}
function copyToClipboardFallback(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('aria-hidden', 'true');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

function addToCart(product, variantIndex, quantity=1){
  const v = (product.variants||[])[variantIndex] || (product.variants||[])[0];
  if(!v) return;
  const key = `${product.id}__${v.sku || v.label}`;
  const existing = state.cart.find(i=>i.key===key);
  if(existing){ existing.qty += quantity; }
  else {
    // Incluimos el código de variante si existiera (tu JSON lo trae como "cod" -> acá uso "code")
    const possibleCode = v.code ?? v.cod ?? v.sku ?? null;
    state.cart.push({
      key, productId:product.id, name:product.name,
      code:possibleCode, variant:v.label, price:+v.price||0, qty:quantity
    });
  }
  saveCart(); renderCart();
}

function changeQty(key, delta){
  const item = state.cart.find(i=>i.key===key); if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){ state.cart = state.cart.filter(i=>i.key!==key); }
  clearImportantAcceptIfCartEmpty();
  saveCart(); renderCart();
}
function removeItem(key){
  state.cart = state.cart.filter(i=>i.key!==key);
  clearImportantAcceptIfCartEmpty();
  saveCart(); renderCart();
}
function clearCart(){
  state.cart = [];
  setImportantAccepted(false);
  saveCart(); renderCart();
}

function subtotal(){ return state.cart.reduce((s,i)=> s + i.price * i.qty, 0); }

async function sendOrderToSheet(){
  if(!state.place){
    console.warn('No hay lugar seleccionado');
    return { success: false, error: 'No hay lugar seleccionado' };
  }
  
  const cust = readCustomerFromForm();
  if(!hasRequiredCheckoutFields(cust)){
    return { success: false, error: 'Faltan nombre, dirección, DNI o entrega' };
  }
  
  const sub = subtotal();
  const ship = getShippingPrice(sub);
  const total = sub + ship;
  const zoneOpt = getCurrentZoneOption();
  
  // Preparar datos del pedido
  const orderData = {
    place: state.place,
    placeName: state.placeName,
    customer: cust,
    items: state.cart.map(i => ({
      code: i.code || '',
      name: i.name,
      variant: i.variant,
      qty: i.qty,
      price: i.price,
      subtotal: i.price * i.qty
    })),
    subtotal: sub,
    shipping: {
      label: getShippingLine(sub),
      price: ship,
      zoneId: zoneOpt ? state.deliveryZone : '',
      zoneLabel: zoneOpt ? zoneOpt.label : ''
    },
    total: total,
    timestamp: new Date().toISOString()
  };
  
  return new Promise((resolve) => {
    try {
      // Crear iframe invisible para recibir respuesta
      let iframe = document.getElementById('order-response-frame');
      if(!iframe){
        iframe = document.createElement('iframe');
        iframe.id = 'order-response-frame';
        iframe.name = 'order-response-frame';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
      }
      
      // Listener para capturar respuesta del iframe
      const messageHandler = (event) => {
        // Validar origen si es necesario
        if(event.data && typeof event.data === 'object'){
          console.log('Respuesta recibida:', event.data);
          window.removeEventListener('message', messageHandler);
          resolve(event.data);
        }
      };
      window.addEventListener('message', messageHandler);
      
      // Timeout de seguridad (10 segundos)
      setTimeout(() => {
        window.removeEventListener('message', messageHandler);
        resolve({ success: true, message: 'Pedido enviado (sin confirmación)' });
      }, 10000);
      
      // Crear formulario
      let form = document.getElementById('order-submit-form');
      if(form) form.remove();
      
      form = document.createElement('form');
      form.id = 'order-submit-form';
      form.method = 'POST';
      form.action = ORDERS_URL;
      form.target = 'order-response-frame';
      form.style.display = 'none';
      
      // Agregar campo con datos JSON
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'orderData';
      input.value = JSON.stringify(orderData);
      form.appendChild(input);
      
      // Agregar al DOM y enviar
      document.body.appendChild(form);
      
      console.log('Enviando pedido:', orderData);
      form.submit();
      
    } catch(err) {
      console.error('Error al enviar pedido:', err);
      resolve({ success: false, error: err.message });
    }
  });
}

function buildWhatsAppURL(){
  if(!STORE.phone || STORE.phone.replace(/\D/g,'').length < 10){
    alert('Configurá tu número de WhatsApp en STORE.phone (formato internacional).');
    return '#';
  }
  if(state.cart.length===0){ alert('Tu carrito está vacío.'); return '#'; }

  const cust = readCustomerFromForm();
  if(!hasRequiredCheckoutFields(cust)){
    alert('Por favor, completá nombre, dirección, DNI y entrega para continuar, necesitamos estos datos para gestionar tu pedido.');
    return '#';
  }
  const sub = subtotal();
  const ship = getShippingPrice(sub);
  const total = sub + ship;
  const zoneOpt = getCurrentZoneOption();

  const items = state.cart
    .map(i=>`• ${i.name} (${i.variant}) x${i.qty} — ${fmt.format(i.price*i.qty)}`)
    .join('%0A');

  const msg = [
    `Hola ${STORE.personalName}! Quiero hacer un pedido:`,
    '',
    items,
    '',
    `Subtotal: ${fmt.format(sub)}`,
    `Envío: ${getShippingLine(sub)}`,
    `TOTAL: ${fmt.format(total)}`,
    '',
    `Nombre: ${cust.name || '-'}`,
    `DNI: ${cust.dni || '-'}`,
    `Teléfono: ${cust.phone || '-'}`,
    `Dirección: ${cust.address || '-'}`,
    `Barrio / zona: ${cust.area || '-'}`,
    zoneOpt ? `Entrega: ${zoneOpt.label}` : '',
    `Lugar: ${state.placeName || '-'}`,
    cust.notes ? `Notas: ${cust.notes}` : ''
  ].filter(Boolean).join('%0A');

  return `https://wa.me/${STORE.phone}?text=${msg}`;
}

  };

  // Variable para controlar si hay que mostrar popup al volver
  let pendingThankYouMessage = false;
  
  // Listener para cuando el usuario vuelve a la pestaña
  window.addEventListener('focus', () => {
    if(pendingThankYouMessage){
      pendingThankYouMessage = false;
      alert('¡Gracias por tu pedido! 🎉\n\nSeguimos por WhatsApp para confirmar los detalles.');
    }
  });
  
  // Acciones carrito
  $('#clearBtn').onclick = ()=>{ if(confirm('¿Vaciar carrito?')) clearCart(); };
  $('#whatsBtn').onclick = ()=>{
    // Abrir WhatsApp inmediatamente
    const url = buildWhatsAppURL();
    if(url && url !== '#'){
      window.open(url, '_blank');
      
      // Cerrar el drawer del carrito
      onDrawerCloseImportant();
      $('#drawer').classList.remove('open');
      
      // Marcar que hay que mostrar el popup cuando vuelva el usuario
      pendingThankYouMessage = true;
      
      // Guardar en el sheet en segundo plano (silencioso)
      sendOrderToSheet().then(result => {
        if(result.success){
          console.log('✅ Pedido guardado correctamente en el sistema');
        } else {
          console.warn('⚠️ No se pudo guardar el pedido:', result.error);
        }
      }).catch(err => {
        console.error('❌ Error al guardar pedido:', err);
      });
    }
  };

  // Botones navegación
  $('#changePlaceBtn').onclick = ()=>{ showView('places'); };
  $('#changePlaceBtn2').onclick = ()=>{ showView('places'); };
  $('#backToCatsBtn').onclick = async ()=>{ 
    showView('home'); 
    renderCategories(); 
    // Renderizar las tarjetas de categorías si ya están cargadas
    if (INDEX.length > 0) {
      await renderHomeCats(); 
    }
  };
  

  // Render inicial
  showView('places');
  await fetchPlacesMeta();
  renderCart();
}
init();
</script>
</body>
</html>
